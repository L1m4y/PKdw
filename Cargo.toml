[package]
name = "pkdw"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A fast, self-contained PikPak CLI downloader written in Rust"
license = "GPL-3.0-or-later"
repository = "https://github.com/L1m4y/PKdw"
default-run = "pkdw"

[[bin]]
name = "pkdw"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
futures = "0.3"
fs2 = "0.4"
hex = "0.4"
indicatif = "0.17"
md5 = "0.7"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
url = "2"

# Clipboard access is done through ordinary system commands (wl-paste, xclip,
# xsel). PKdw therefore builds on minimal systems and still works without
# them: pipe the copied token to `pkdw auth --stdin` instead.

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
